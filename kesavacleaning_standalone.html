      // Date Range Filter & Sales Analytics State
      const [orderPeriodFilter, setOrderPeriodFilter] = useState('all'); // 'all', 'week', 'month', 'year', 'custom'
      const [customStartDate, setCustomStartDate] = useState('');
      const [customEndDate, setCustomEndDate] = useState('');

      const isAdmin = currentUser && currentUser.role === 'admin';

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // Populate checkout fields when currentUser changes
      useEffect(() => {
        if (currentUser) {
          setCheckoutName(currentUser.name || "");
          setCheckoutPhone(currentUser.phone || "");
          setCheckoutAddress(currentUser.address || "");
        }
      }, [currentUser]);

      // Effective Price Helper (Calculates individual discount + store-wide sale)
      const getEffectivePrice = (prod) => {
        let price = Number(prod.offerPrice) || Number(prod.regularPrice);
        if (storeWideDiscount && storeWideDiscount.active && storeWideDiscount.percentage > 0) {
          price = Math.round(price * (1 - storeWideDiscount.percentage / 100));
        }
        return price;
      };

      // Cart Calculations
      const cartSubtotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + (getEffectivePrice(item) * item.cartQty), 0);
      }, [cart, storeWideDiscount]);

      const discountAmount = useMemo(() => {
        if (!appliedCoupon) return 0;
        if (appliedCoupon.value <= 100) {
          return Math.round((cartSubtotal * appliedCoupon.value) / 100);
        }
        return appliedCoupon.value;
      }, [appliedCoupon, cartSubtotal]);

      const cartTotal = Math.max(0, cartSubtotal - discountAmount);

      // Safe date parser
      const parseOrderDate = (order) => {
        if (order.createdAt) {
          const d = new Date(order.createdAt);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.date) {
          const d = new Date(order.date);
          if (!isNaN(d.getTime())) return d;
        }
        return new Date();
      };

      // Order Analytics Breakdown (Week, Month, Year, All)
      const orderAnalytics = useMemo(() => {
        const now = new Date();
        const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        sevenDaysAgo.setHours(0, 0, 0, 0);
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
        const startOfYear = new Date(now.getFullYear(), 0, 1, 0, 0, 0);

        let weekOrders = 0, weekRevenue = 0, weekUnits = 0;
        let monthOrders = 0, monthRevenue = 0, monthUnits = 0;
        let yearOrders = 0, yearRevenue = 0, yearUnits = 0;

        orders.forEach(o => {
          const d = parseOrderDate(o);
          const rev = Number(o.total) || 0;
          const units = (o.items || []).reduce((sum, it) => sum + (Number(it.qty) || 1), 0);

          if (d >= sevenDaysAgo) {
            weekOrders++;
            weekRevenue += rev;
            weekUnits += units;
          }
          if (d >= startOfMonth) {
            monthOrders++;
            monthRevenue += rev;
            monthUnits += units;
          }
          if (d >= startOfYear) {
            yearOrders++;
            yearRevenue += rev;
            yearUnits += units;
          }
        });

        return {
          week: { count: weekOrders, revenue: weekRevenue, units: weekUnits },
          month: { count: monthOrders, revenue: monthRevenue, units: monthUnits },
          year: { count: yearOrders, revenue: yearRevenue, units: yearUnits }
        };
      }, [orders]);

      // Filtered Orders for the active view
      const filteredOrders = useMemo(() => {
        const now = new Date();
        if (orderPeriodFilter === 'all') return orders;
        if (orderPeriodFilter === 'week') {
          const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          sevenDaysAgo.setHours(0, 0, 0, 0);
          return orders.filter(o => parseOrderDate(o) >= sevenDaysAgo);
        }
        if (orderPeriodFilter === 'month') {
          const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
          return orders.filter(o => parseOrderDate(o) >= startOfMonth);
        }
        if (orderPeriodFilter === 'year') {
          const startOfYear = new Date(now.getFullYear(), 0, 1, 0, 0, 0);
          return orders.filter(o => parseOrderDate(o) >= startOfYear);
        }
        if (orderPeriodFilter === 'custom') {
          return orders.filter(o => {
            const d = parseOrderDate(o);
            if (customStartDate) {
              const start = new Date(customStartDate);
              start.setHours(0, 0, 0, 0);
              if (d < start) return false;
            }
            if (customEndDate) {
              const end = new Date(customEndDate);
              end.setHours(23, 59, 59, 999);
              if (d > end) return false;
            }
            return true;
          });
        }
        return orders;
      }, [orders, orderPeriodFilter, customStartDate, customEndDate]);

      const filteredStats = useMemo(() => {
        const count = filteredOrders.length;
        const revenue = filteredOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
        const units = filteredOrders.reduce((sum, o) => sum + (o.items || []).reduce((s, it) => s + (Number(it.qty) || 1), 0), 0);
        const avgOrderValue = count > 0 ? Math.round(revenue / count) : 0;
        return { count, revenue, units, avgOrderValue };
      }, [filteredOrders]);

      // Export Order Ledger to Excel (CSV with UTF-8 BOM)
      const downloadExcelReport = () => {
        if (filteredOrders.length === 0) {
          showToast("No orders available in the selected date range to export.");
          return;
        }

        const headers = [
          "Row #",
          "Order ID",
          "Sale Date",
          "Product Name",
          "Category Name",
          "Bottle Volume",
          "Unit Price (INR)",
          "Units Bought (Qty)",
          "Item Subtotal (INR)",
          "Order Grand Total (INR)",
          "Payment Method",
          "Fulfillment Status",
          "Customer Name",
          "Customer Phone",
          "Delivery Address"
        ];

        const escapeCsv = (val) => {
          if (val === null || val === undefined) return '""';
          const str = String(val).replace(/"/g, '""');
          return `"${str}"`;
        };

        const rows = [];
        let rowIndex = 1;
        let totalUnitsExported = 0;
        let totalRevenueExported = 0;

        filteredOrders.forEach(order => {
          const saleDateStr = order.createdAt 
            ? new Date(order.createdAt).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) 
            : (order.date || "N/A");

          if (order.items && order.items.length > 0) {
            order.items.forEach(item => {
              const itemQty = Number(item.qty) || 1;
              const itemPrice = Number(item.price) || 0;
              const itemSubtotal = itemQty * itemPrice;
              totalUnitsExported += itemQty;

              rows.push([
                rowIndex++,
                order.orderId || "N/A",
                saleDateStr,
                item.name || "Cleaning Liquid Formulation",
                item.category || "Cleaning Formulations",
                item.volume || "Standard Bottle",
                itemPrice,
                itemQty,
                itemSubtotal,
                order.total || itemSubtotal,
                order.paymentMethod || "Prepaid",
                order.status || "Pending",
                order.customerName || "Customer",
                order.phone || "N/A",
                order.address || "N/A"
              ]);
            });
          }
          totalRevenueExported += Number(order.total) || 0;
        });

        // Summary totals row
        rows.push([]);
        rows.push([
          "SUMMARY TOTALS",
          `Total Orders: ${filteredOrders.length}`,
          `Filter Period: ${orderPeriodFilter.toUpperCase()}`,
          "",
          "",
          "",
          "",
          `Total Units Sold: ${totalUnitsExported}`,
          "",
          `Gross Sales: INR ${totalRevenueExported}`,
          "",
          "",
          "",
          "",
          ""
        ]);

        const csvContent = "\uFEFF" + [
          headers.map(escapeCsv).join(","),
          ...rows.map(row => row.map(escapeCsv).join(","))

            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <span className="font-bold text-white">KesavaCleaning Pvt Ltd &bull; 2026</span>
              <span>Pure Liquid Formulations &bull; Engineered in India</span>
              <button onClick={() => setCurrentRoute('/admin')} className="text-emerald-400 hover:underline">
                Admin Terminal
              </button>
            </div>
          </footer>

          {/* AUTHENTICATION MODAL (LOGIN & SIGN UP) */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl border border-neutral-200">
                <div className="flex justify-between items-center pb-2 border-b">
                  <div>
                    <h3 className="font-black text-lg text-neutral-900">
                      {authMode === 'login' ? 'Customer Sign In' : 'Create Customer Account'}
                    </h3>
                    <p className="text-[11px] text-neutral-500">
                      {authMode === 'login' ? 'Enter your credentials to continue' : 'Sign up to purchase and track dispatches'}
                    </p>
                  </div>
                  <button onClick={() => setAuthModalOpen(false)} className="text-neutral-400 hover:text-neutral-700 font-bold">✕</button>
                </div>

                {authMode === 'login' ? (
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const found = users.find(u => u.email.toLowerCase() === regEmail.trim().toLowerCase() && u.password === regPass.trim());
                    if (found) {
                      setCurrentUser(found);
                      setAuthModalOpen(false);
                      showToast(`Welcome back, ${found.name}!`);
                      setRegEmail("");
                      setRegPass("");
                    } else {
                      alert("Invalid credentials. Please check your email or password.");
                    }
                  }} className="space-y-3 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Email Address</label>
                      <input 
                        type="email" 
                        required 
                        placeholder="e.g. priya@example.com" 
                        value={regEmail} 
                        onChange={e => setRegEmail(e.target.value)} 
                        className="w-full p-2.5 border rounded-xl bg-neutral-50 font-bold" 
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Password</label>
                      <input 
                        type="password" 
                        required 
                        placeholder="••••••••" 
                        value={regPass} 
                        onChange={e => setRegPass(e.target.value)} 
                        className="w-full p-2.5 border rounded-xl bg-neutral-50" 
                      />
                    </div>
                    <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 shadow-md shadow-emerald-200">
                      Sign In to Account
                    </button>
                    <div className="text-center pt-2 border-t">
                      <span className="text-neutral-500 text-[11px]">Don't have an account? </span>
                      <button 
                        type="button" 
                        onClick={() => setAuthMode('signup')} 
                        className="text-emerald-700 font-black hover:underline text-[11px]"
                      >
                        Register Now
                      </button>
                    </div>
                  </form>
                ) : (
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const newUser = {
                      id: `u-${Date.now()}`,
                      name: regName,
                      email: regEmail,
                      password: regPass,
                      phone: regPhone,
                      role: "customer",
                      address: "Bengaluru, Karnataka"
                    };
                    setUsers([...users, newUser]);
                    setCurrentUser(newUser);
                    setAuthModalOpen(false);
                    showToast(`Account created! Logged in as ${newUser.name}`);
                    setRegName("");
                    setRegEmail("");
                    setRegPass("");
                    setRegPhone("");
                  }} className="space-y-3 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Full Name</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Rajesh Kumar" 
                        value={regName} 
                        onChange={e => setRegName(e.target.value)} 
                        className="w-full p-2 border rounded-xl bg-neutral-50 font-bold" 
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Email</label>
                      <input 
                        type="email" 
                        required 
                        placeholder="rajesh@example.com" 
                        value={regEmail} 
                        onChange={e => setRegEmail(e.target.value)} 
                        className="w-full p-2 border rounded-xl bg-neutral-50 font-bold" 
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Mobile Phone</label>
                      <input 
                        type="tel" 
                        required 
                        placeholder="+91 98765 43210" 
                        value={regPhone} 
                        onChange={e => setRegPhone(e.target.value)} 
                        className="w-full p-2 border rounded-xl bg-neutral-50 font-bold" 
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Password</label>
                      <input 
                        type="password" 
                        required 
                        placeholder="••••••••" 
                        value={regPass} 
                        onChange={e => setRegPass(e.target.value)} 
                        className="w-full p-2 border rounded-xl bg-neutral-50" 
                      />
                    </div>
                    <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 shadow-md shadow-emerald-200">
                      Complete Registration
                    </button>
                    <div className="text-center pt-2 border-t">
                      <span className="text-neutral-500 text-[11px]">Already have an account? </span>
                      <button 
                        type="button" 
                        onClick={() => setAuthMode('login')} 
                        className="text-emerald-700 font-black hover:underline text-[11px]"
                      >
                        Sign In
                      </button>
                    </div>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* FLOATING TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-neutral-900 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-2xl border border-neutral-700 animate-bounce">
              {toast}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
